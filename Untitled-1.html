<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha de Controle de Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Cinza claro de fundo */
        }
        .container {
            max-width: 800px; /* Largura máxima do container */
            margin: 2rem auto; /* Centraliza e adiciona margem */
            padding: 1.5rem; /* Espaçamento interno */
            background-color: white; /* Fundo branco para o conteúdo */
            border-radius: 0.75rem; /* Bordas arredondadas */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* Sombra suave */
        }
        .table-header th {
            background-color: #e5e7eb; /* Cinza mais claro para o cabeçalho da tabela */
        }
        .btn {
            transition: background-color 0.3s ease; /* Transição suave para botões */
        }
        .btn-primary {
            background-color: #3b82f6; /* Azul primário */
            color: white;
        }
        .btn-primary:hover {
            background-color: #2563eb; /* Azul mais escuro no hover */
        }
        .btn-danger {
            background-color: #ef4444; /* Vermelho para perigo */
            color: white;
        }
        .btn-danger:hover {
            background-color: #dc2626; /* Vermelho mais escuro no hover */
        }
        /* Estilo para a mensagem de feedback */
        .feedback-message {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            display: none; /* Escondido por padrão */
        }
        .feedback-success {
            background-color: #d1fae5; /* Verde claro */
            color: #065f46; /* Verde escuro */
            border: 1px solid #6ee7b7; /* Borda verde */
        }
        .feedback-error {
            background-color: #fee2e2; /* Vermelho claro */
            color: #991b1b; /* Vermelho escuro */
            border: 1px solid #fca5a5; /* Borda vermelha */
        }
        /* Responsividade para telas menores */
        @media (max-width: 640px) {
            .container {
                margin: 1rem;
                padding: 1rem;
            }
            .form-grid {
                grid-template-columns: 1fr; /* Uma coluna em telas pequenas */
            }
            .table-container {
                overflow-x: auto; /* Adiciona scroll horizontal se a tabela for muito larga */
            }
            table {
                min-width: 500px; /* Garante que a tabela tenha uma largura mínima */
            }
            .total-gastos-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .total-gastos-container button {
                margin-top: 0.5rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Controle de Gastos Mensais</h1>

        <div id="feedbackMessage" class="feedback-message"></div>

        <form id="expenseForm" class="mb-8 p-6 bg-gray-50 rounded-lg shadow">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 form-grid">
                <div>
                    <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Data:</label>
                    <input type="date" id="date" name="date" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Descrição:</label>
                    <input type="text" id="description" name="description" placeholder="Ex: Compras de supermercado" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Categoria:</label>
                    <select id="category" name="category" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">Selecione uma categoria</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Saúde">Saúde</option>
                        <option value="Educação">Educação</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Vestuário">Vestuário</option>
                        <option value="Contas">Contas Fixas (água, luz, internet)</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Valor (R$):</label>
                    <input type="number" id="amount" name="amount" placeholder="Ex: 150.75" step="0.01" min="0.01" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
            <div class="mt-6 text-right">
                <button type="submit" class="btn btn-primary px-6 py-2 rounded-md font-semibold shadow-md hover:shadow-lg">
                    Adicionar Despesa
                </button>
            </div>
        </form>

        <h2 class="text-2xl font-semibold text-gray-700 mb-4">Lista de Despesas</h2>
        <div class="table-container bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="table-header">
                    <tr>
                        <th scope="col" class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Data</th>
                        <th scope="col" class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Descrição</th>
                        <th scope="col" class="px-4 sm:px-6 py-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Categoria</th>
                        <th scope="col" class="px-4 sm:px-6 py-3 text-right text-xs font-medium text-gray-600 uppercase tracking-wider">Valor (R$)</th>
                        <th scope="col" class="px-4 sm:px-6 py-3 text-center text-xs font-medium text-gray-600 uppercase tracking-wider">Ação</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody" class="bg-white divide-y divide-gray-200">
                    </tbody>
            </table>
        </div>
        <div id="noExpensesMessage" class="text-center text-gray-500 py-8" style="display: none;">
            Nenhuma despesa registrada ainda. Adicione sua primeira despesa acima!
        </div>

        <div class="mt-8 p-6 bg-gray-100 rounded-lg shadow total-gastos-container flex justify-between items-center">
            <div>
                <h3 class="text-xl font-semibold text-gray-800">Total de Despesas:
                    <span id="totalAmount" class="text-2xl font-bold text-indigo-600">R$ 0,00</span>
                </h3>
            </div>
            <button id="clearAllButton" class="btn btn-danger px-4 py-2 rounded-md font-semibold shadow-md hover:shadow-lg">
                Limpar Todas as Despesas
            </button>
        </div>
    </div>

    <script>
        // Elementos do DOM
        const expenseForm = document.getElementById('expenseForm');
        const expenseTableBody = document.getElementById('expenseTableBody');
        const totalAmountDisplay = document.getElementById('totalAmount');
        const clearAllButton = document.getElementById('clearAllButton');
        const dateInput = document.getElementById('date');
        const noExpensesMessage = document.getElementById('noExpensesMessage');
        const feedbackMessageDiv = document.getElementById('feedbackMessage');

        // Inicializa as despesas a partir do localStorage ou como um array vazio
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        // Função para formatar a data para o padrão brasileiro (dd/mm/yyyy)
        function formatDate(dateString) {
            if (!dateString) return '';
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        }

        // Função para formatar o valor para o padrão monetário brasileiro (R$ X.XXX,XX)
        function formatCurrency(amount) {
            return parseFloat(amount).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Função para mostrar mensagem de feedback
        function showFeedback(message, type = 'success') {
            feedbackMessageDiv.textContent = message;
            feedbackMessageDiv.className = `feedback-message ${type === 'success' ? 'feedback-success' : 'feedback-error'}`;
            feedbackMessageDiv.style.display = 'block';
            setTimeout(() => {
                feedbackMessageDiv.style.display = 'none';
            }, 3000); // Esconde a mensagem após 3 segundos
        }

        // Função para renderizar as despesas na tabela
        function renderExpenses() {
            expenseTableBody.innerHTML = ''; // Limpa a tabela antes de renderizar
            if (expenses.length === 0) {
                noExpensesMessage.style.display = 'block';
            } else {
                noExpensesMessage.style.display = 'none';
                expenses.forEach((expense, index) => {
                    const row = expenseTableBody.insertRow();
                    row.innerHTML = `
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-gray-700">${formatDate(expense.date)}</td>
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-gray-700">${expense.description}</td>
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-gray-700">${expense.category}</td>
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-gray-700 text-right">${formatCurrency(expense.amount)}</td>
                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-center">
                            <button onclick="deleteExpense(${index})" class="text-red-600 hover:text-red-800 font-medium">Excluir</button>
                        </td>
                    `;
                });
            }
            updateTotal();
            saveExpenses();
        }

        // Função para atualizar o total de despesas
        function updateTotal() {
            const total = expenses.reduce((sum, expense) => sum + parseFloat(expense.amount), 0);
            totalAmountDisplay.textContent = formatCurrency(total);
        }

        // Função para salvar as despesas no localStorage
        function saveExpenses() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        // Função para adicionar uma nova despesa
        expenseForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Previne o envio padrão do formulário

            const date = event.target.date.value;
            const description = event.target.description.value.trim();
            const category = event.target.category.value;
            const amount = parseFloat(event.target.amount.value);

            // Validação simples
            if (!date || !description || !category || isNaN(amount) || amount <= 0) {
                showFeedback('Por favor, preencha todos os campos corretamente. O valor deve ser positivo.', 'error');
                return;
            }

            const newExpense = { date, description, category, amount };
            expenses.push(newExpense);

            // Ordena as despesas por data (mais recentes primeiro)
            expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

            renderExpenses();
            expenseForm.reset(); // Limpa o formulário
            dateInput.valueAsDate = new Date(); // Define a data para hoje após adicionar
            showFeedback('Despesa adicionada com sucesso!', 'success');
        });

        // Função para deletar uma despesa
        window.deleteExpense = function(index) { // Torna a função acessível globalmente
            if (confirm('Tem certeza que deseja excluir esta despesa?')) {
                expenses.splice(index, 1);
                renderExpenses();
                showFeedback('Despesa excluída com sucesso!', 'success');
            }
        }

        // Função para limpar todas as despesas
        clearAllButton.addEventListener('click', function() {
            if (expenses.length === 0) {
                showFeedback('Não há despesas para limpar.', 'error');
                return;
            }
            if (confirm('Tem certeza que deseja limpar TODAS as despesas? Esta ação não pode ser desfeita.')) {
                expenses = [];
                renderExpenses();
                showFeedback('Todas as despesas foram limpas!', 'success');
            }
        });

        // Define a data atual no campo de data ao carregar a página
        window.onload = function() {
            if (!dateInput.value) {
                 // Obtém a data atual no fuso horário local
                const today = new Date();
                const offset = today.getTimezoneOffset(); // Diferença em minutos entre UTC e local
                const localToday = new Date(today.getTime() - (offset * 60 * 1000));
                dateInput.value = localToday.toISOString().split('T')[0];
            }
            renderExpenses(); // Renderiza as despesas ao carregar a página
        };
    </script>
</body>
</html>
